<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>旅行癞疙宝 · 交互线框</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft Yahei",sans-serif;color:#303c3c;background:#f0f1ee;font-size:16px;line-height:1.6}*{box-sizing:border-box}body{margin:0}button,a{touch-action:manipulation}button{font:inherit;cursor:pointer;color:inherit;background:#fff;border:1px solid #a3ada8;border-radius:8px;min-height:44px;padding:8px 14px}button:hover{background:#edf2ed}button:focus-visible,a:focus-visible{outline:3px solid #568873;outline-offset:3px}button:disabled{opacity:.55;cursor:default}a{color:#3d6354}h1,h2,h3,p{margin:0 0 12px}h1{font-size:28px;line-height:1.3}h2{font-size:22px}h3{font-size:16px}.layout{max-width:1120px;display:grid;grid-template-columns:280px 390px 260px;gap:42px;padding:48px 20px;margin:auto;align-items:start}.eyebrow{font-size:12px;letter-spacing:2px;color:#64766b;text-transform:uppercase;margin-bottom:12px}.muted{color:#6c7671;font-size:14px}.label{font-size:12px;color:#748179}.intro p{margin-bottom:24px}.states{display:grid;gap:8px;margin:24px 0}.states button{text-align:left}.states [aria-pressed="true"]{background:#364c41;color:white;border-color:#364c41}.phone{background:#fcfcf9;border:2px solid #536158;border-radius:24px;padding:8px;box-shadow:0 12px 40px #263c3210;position:relative;overflow:hidden}.top{display:flex;align-items:center;justify-content:space-between;padding:12px}.brand{font-size:18px;font-weight:600}.status{padding:12px 14px;background:#ecf0e9;border:1px solid #ced6ce;margin:0 6px 10px;border-radius:10px;min-height:84px}.status strong{display:block;font-size:16px}.scene{height:407px;position:relative;margin:6px;background:repeating-linear-gradient(0deg,transparent 0,transparent 29px,#637c6910 30px),repeating-linear-gradient(90deg,transparent 0,transparent 29px,#637c6910 30px);border:1px solid #a9b3ab;border-radius:12px;overflow:hidden}.object{position:absolute;border:1px dashed #8c978f;background:#fafbf5b8;border-radius:6px;display:grid;place-content:center;text-align:center;padding:6px;font-size:14px}.object small{font-size:12px;color:#737e77}.object.hot{border:1.5px solid #52695a;background:#edf2e9}.scene-title{position:absolute;top:10px;left:12px;color:#869087;font-size:12px;letter-spacing:2px}.floor{position:absolute;left:0;right:0;bottom:0;height:44%;border-top:1px solid #a9b3ab;background:#818c6e08}.nav{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;padding:10px 5px}.nav button{padding:9px 3px;font-size:14px;border-color:transparent;background:transparent}.nav .active{background:#e1e8db;border-color:#b2bcad}.notes{font-size:14px}.notes section{padding:18px 0;border-bottom:1px solid #d3dbd3}.notes ol{padding-left:20px}.notes code{font-size:12px}.primary{background:#364c41!important;color:white!important;border-color:#364c41!important;width:100%}.secondary{width:100%;margin-top:8px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.slot{min-height:110px;text-align:left;background:#f3f5ef;padding:15px}.slot b{display:block}.item{border-bottom:1px solid #d4dcd2;padding:14px 0}.item b{display:block}.item small{font-size:14px;color:#737d74}.summary{padding:16px;background:#edf1e8;border-radius:8px;margin:18px 0}.tabs{display:flex;gap:6px;margin-bottom:18px}.tabs button{flex:1;padding:8px 4px;font-size:14px}.empty{text-align:center;border:1px dashed #a9b3ab;border-radius:8px;padding:36px 15px;margin:12px 0;color:#68766b}.card-art{height:180px;border:1px dashed #9ba995;display:grid;place-content:center;background:repeating-linear-gradient(-45deg,#e8ece4,#e8ece4 10px,#f3f4ef 10px,#f3f4ef 20px);text-align:center;margin-bottom:16px}.back{border:0;background:transparent;padding-left:0}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#303f36;color:#fff;padding:12px 20px;border-radius:10px;z-index:9;max-width:90vw;width:max-content;display:none}.toast.show{display:block}dialog{border:1px solid #9ba996;border-radius:18px;background:#fcfcf7;color:#303c3c;width:min(380px,calc(100vw - 24px));max-height:85dvh;padding:22px;box-shadow:0 20px 60px #1c2d2340}dialog::backdrop{background:#283b344f}.dialog-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.dialog-head h2{margin:0}.close{width:44px;padding:5px;border:0;background:transparent;font-size:24px}.content{min-height:180px}.caption{font-size:12px;color:#758071;text-align:center;margin:14px 0}.note-id{display:inline-block;font:12px ui-monospace,monospace;border:1px solid #bac6b7;padding:2px 7px;border-radius:4px;margin-bottom:8px}.flow{line-height:2;color:#5d6a60}.footlink{display:block;margin-top:22px;font-size:14px}
@media(max-width:1040px){.layout{grid-template-columns:minmax(190px,260px) 390px;justify-content:center;gap:24px}.notes{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:24px}}@media(max-width:690px){.layout{display:block;padding:20px 12px}.intro{max-width:390px;margin:auto}.intro h1{font-size:24px}.intro p{margin-bottom:10px}.states{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0}.states button{font-size:14px;padding:6px 10px}.phone{max-width:390px;margin:auto}.notes{display:block;max-width:390px;margin:22px auto}.scene{height:390px}.intro .footlink{margin:10px 0 20px}}
</style>
</head>
<body>
<main class="layout">
<aside class="intro"><div class="eyebrow">01 / Interaction wireframe</div><h1>旅行癞疙宝<br>交互线框</h1><p class="muted">点场景中的实线区域走一遍流程。这里使用演示数据，不影响试玩存档。</p><div class="states" aria-label="切换场景状态"><button data-state="home">01 在家</button><button data-state="packed">02 已备妥</button><button data-state="traveling">03 旅行中</button><button data-state="letter">04 新来信</button><button data-state="returned">05 已归来</button></div><p class="muted">实线框：可点击<br>虚线框：环境占位<br>侧栏按钮：模拟状态</p><a class="footlink" href="/">打开第 2 步可玩原型 →</a></aside>
<section><div class="phone"><header class="top"><span class="brand">旅行癞疙宝</span><button data-action="settings" aria-label="打开设置">设置</button></header><div class="status" aria-live="polite" id="status"></div><div class="scene" id="scene"></div><nav class="nav" aria-label="游戏导航"><button data-action="home">屋里</button><button data-action="yard">院坝</button><button data-action="bag">行囊</button><button data-action="journal">手账</button></nav></div><p class="caption">两景布局 · 单层面板 · 点击完成所有操作</p></section>
<aside class="notes"><section><span class="note-id" id="screen-id">HOME / 01</span><h3 id="note-title">屋里 · 在家</h3><p id="note-copy"></p></section><section><h3>主操作路径</h3><p class="flow">行囊 → 选择吃食 → 收拾好了<br>自行出发 → 信夹 → 看来信<br>自动归来 → 纪念物入册</p></section><section><h3>固定规则</h3><ol><li>出发前能改包、取消。</li><li>旅行中行囊只读。</li><li>免费饭保证能出门。</li><li>看信不触发二次领奖。</li></ol></section></aside>
</main>
<dialog id="sheet" aria-labelledby="sheet-title"><div class="dialog-head"><h2 id="sheet-title"></h2><button class="close" data-action="close" aria-label="关闭面板">×</button></div><div class="content" id="sheet-content"></div></dialog><div id="toast" class="toast" role="status"></div>
<script>
const $=s=>document.querySelector(s);let phase='home',scene='home',panel='',coins=24,food='家常饭',gear='不带用具',unread=false,gotCard=false,gotGift=false,toastTimer;
const object=(label,desc,style,action='')=>`<${action?'button':'div'} class="object ${action?'hot':''}" style="${style}" ${action?`data-action="${action}"`:''}>${label}${desc?`<small>${desc}</small>`:''}</${action?'button':'div'}>`;
function toast(text){$('#toast').textContent=text;$('#toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').classList.remove('show'),2500)}
function setPhase(next){phase=next==='letter'?'traveling':next==='returned'?'home':next;unread=next==='letter';gotCard=next==='letter'||next==='returned';gotGift=next==='returned';render();document.querySelectorAll('[data-state]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.state===next)))}
function render(){let stateName=phase==='home'?(gotGift?'回来了，还带了个小东西':'疙宝在家，正发呆呢'):phase==='packed'?'包包收好了，等它出门':'出门转悠去了';$('#status').innerHTML=`<strong>${stateName}</strong><span class="muted">${unread?'有张来信，去信夹看看。':phase==='home'?'给它收拾一份吃的吧。':phase==='packed'?'出发前还可以调整行囊。':'关掉网页，它也会继续旅行。'}</span><div class="label">盘缠 ${coins} 文</div>`;
$('#scene').innerHTML=scene==='home'?`<span class="scene-title">HOME · 屋里</span><div class="floor"></div>${object('木窗','竹林 / 水渠','left:36%;top:9%;width:35%;height:20%')}${object('竹榻','','left:6%;top:24%;width:24%;height:24%')}${object('侧门','去院坝','right:3%;top:23%;width:19%;height:33%','yard')}${object('矮桌','','left:24%;top:65%;width:42%;height:20%')}${phase==='traveling'?object('空位','出去转转，莫急','left:32%;top:41%;width:28%;height:20%','away'):object('癞疙宝',phase==='packed'?'收拾包袱':'发呆','left:32%;top:40%;width:28%;height:23%','toad')}${phase!=='traveling'?object('布挎包','打开行囊','right:11%;top:66%;width:24%;height:18%','bag'):''}${object(gotGift?'小竹垫':'陈列位',gotGift?'查看纪念物':'待它带回小东西','left:5%;top:86%;width:37%;height:12%','souvenirs')}`:`<span class="scene-title">YARD · 院坝</span>${object('竹林与水渠','远景','left:6%;top:8%;width:88%;height:18%')}${object('屋檐 / 家门','回屋里','left:5%;top:31%;width:30%;height:33%','home')}${object('货架','逛小铺','right:5%;top:30%;width:29%;height:29%','shop')}${object('信夹',unread?'一角新信':'看来信','right:9%;top:64%;width:25%;height:18%','letter')}${object('三处簸箕','收成换盘缠','left:9%;bottom:8%;width:48%;height:23%','harvest')}`;
$('#screen-id').textContent=scene.toUpperCase()+' / '+phase.toUpperCase();$('#note-title').textContent=scene==='home'?'屋里 · 角色与行囊':'院坝 · 收成与来信';$('#note-copy').textContent=scene==='home'?'主角、布包和陈列位是热点。离家后留出空位；角色动作与逻辑状态分开。':'收成、小铺、信夹互不遮挡。成熟和来信都用物件形态变化提示。';document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.action===scene));}
function show(name){panel=name;let title='',html='';if(name==='bag'){title='收拾行囊';html=`<p class="muted">一份吃的，一个可选用具。</p><div class="grid"><button class="slot" data-action="foods" ${phase==='traveling'?'disabled':''}><small>吃食 · 必选</small><b>${food}</b></button><button class="slot" data-action="gears" ${phase==='traveling'?'disabled':''}><small>用具 · 可选</small><b>${gear}</b></button></div><div class="summary">${phase==='traveling'?'这趟已经出发，回来后再收拾。':food==='家常饭'?'家常饭免费，去哪儿都能吃。':'吃食影响旅行倾向，目的地由疙宝自己决定。'}</div>${phase==='traveling'?'':`<button class="primary" data-action="pack">${phase==='packed'?'重新收拾好了':'收拾好了'}</button>${phase==='packed'?'<button class="secondary" data-action="cancel">先不出门了</button>':''}`}`;}
if(name==='foods'){title='带点什么吃的';html='<button class="back" data-action="bag">← 返回行囊</button>'+['家常饭','叶儿粑','锅盔'].map((v,i)=>`<div class="item row"><div><b>${v}</b><small>${i===0?'免费 · 随时可用':'演示库存 1 份'}</small></div><button data-food="${v}">装上</button></div>`).join('');}
if(name==='gears'){title='带个家伙什';html='<button class="back" data-action="bag">← 返回行囊</button>'+['不带用具','小竹筒','油纸伞'].map(v=>`<div class="item row"><b>${v}</b><button data-gear="${v}">选这个</button></div>`).join('');}
if(name==='shop'){title='院坝小铺';html=`<p class="muted">演示盘缠 ${coins} 文</p>`+[['叶儿粑',8],['锅盔',8],['小竹筒',24],['油纸伞',24]].map(([n,p])=>`<div class="item row"><div><b>${n}</b><small>${p} 文${p===24?' · 永久用具':' · 一份'}</small></div><button data-buy="${n}" data-price="${p}">买一${p===24?'件':'份'}</button></div>`).join('');}
if(['journal','souvenirs','records'].includes(name)){title='疙宝的手账';html='<div class="tabs"><button data-action="journal">见闻</button><button data-action="souvenirs">纪念物</button><button data-action="records">旅程</button></div>';if(name==='journal')html+=`<p class="muted">${gotCard?1:0} / 9 张见闻</p>`+(gotCard?'<button class="slot secondary" data-action="letter"><b>竹影里打个盹</b><small>道明竹乡 · 打开来信</small></button>':'<div class="empty">第一张见闻，会随来信抵达。</div>');if(name==='souvenirs')html+=gotGift?'<div class="summary"><b>小竹垫</b><p>一件道明竹乡带回的小东西。</p></div>':'<div class="empty">家里的小格子，等它慢慢填满。</div>';if(name==='records')html+='<div class="summary">'+(gotGift?'第一趟 · 已归来':phase==='traveling'?'第一趟 · 旅行中':'还没有完成的旅程')+'</div>';}
if(name==='letter'){title='有张来信';html=gotCard?'<div class="card-art">道明竹乡<br><small>见闻插画占位</small></div><h3>竹影里打个盹</h3><p>竹影子晃来晃去，它坐着坐着就眯着了。醒来包还在，太阳挪了半截。</p><p class="muted">已自动存入手账</p><button class="secondary" data-action="journal">去手账看看</button>':'<div class="empty">信夹还是空的。疙宝会捎信回来。</div>';if(gotCard){unread=false;render();}}
if(name==='settings'){title='小设置';html='<div class="item row"><label for="sound">声音</label><input type="checkbox" id="sound"></div><div class="item row"><label for="motion">减少动效</label><input type="checkbox" id="motion"></div><div class="summary muted">线框只演示操作结构。存档恢复在可玩原型中验证。</div><button class="secondary" data-action="reset-check">重置演示数据</button>';}
if(name==='reset-check'){title='重置演示数据？';html='<p>演示盘缠、行囊和来信恢复初始状态。</p><button class="primary" data-action="reset">确认重置</button><button class="secondary" data-action="settings">返回设置</button>';}
$('#sheet-title').textContent=title;$('#sheet-content').innerHTML=html;if(!$('#sheet').open)$('#sheet').showModal();}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.state){$('#sheet').close();setPhase(b.dataset.state);return;}if(b.dataset.food){food=b.dataset.food;show('bag');return;}if(b.dataset.gear){gear=b.dataset.gear;show('bag');return;}if(b.dataset.buy){const price=Number(b.dataset.price);if(coins<price){toast('盘缠不够，可以先装免费的家常饭。');return;}coins-=price;render();show('shop');toast('演示购买：'+b.dataset.buy);return;}const a=b.dataset.action;if(a==='close'){$('#sheet').close();return;}if(a==='home'||a==='yard'){scene=a;$('#sheet').close();render();return;}if(a==='pack'){phase='packed';$('#sheet').close();render();toast('收拾好了。用左侧状态切换模拟出门。');return;}if(a==='cancel'){setPhase('home');$('#sheet').close();toast('行囊已取消，吃食没有损耗。');return;}if(a==='toad'){toast(phase==='packed'?'在包边上磨蹭了一会儿。':'它看了你一眼，又坐稳了。');return;}if(a==='away'){toast('出门转悠去了，包也带走了。');return;}if(a==='harvest'){coins+=12;render();toast('演示收成：盘缠 +12 文');return;}if(a==='reset'){coins=24;food='家常饭';gear='不带用具';scene='home';setPhase('home');$('#sheet').close();return;}show(a);});$('#sheet').addEventListener('click',e=>{if(e.target===$('#sheet')){const r=$('#sheet').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)$('#sheet').close();}});setPhase('home');
</script>
<script>
// 操作后同步评审状态，面板原位切换时保持键盘焦点在弹层内。
document.addEventListener('click',()=>requestAnimationFrame(()=>{
  const current=phase==='home'&&gotGift?'returned':phase==='traveling'&&unread?'letter':phase;
  document.querySelectorAll('[data-state]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.state===current)));
  if($('#sheet').open&&!$('#sheet').contains(document.activeElement)){$('#sheet-title').tabIndex=-1;$('#sheet-title').focus();}
}));
</script>
</body>
</html>
